spring.application.name=be
spring.config.import=optional:file:./.env[.properties],optional:file:./management-system/be/.env[.properties]
server.port=8081

# postgres
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.timezone=Asia/Ho_Chi_Minh
spring.jpa.hibernate.ddl-auto=update
# keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/vdt-shared-lib
#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=true

spring.kafka.consumer.group-id=management-system
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# anomaly detector metric extraction
vdt.anomaly.detector.enabled=true
vdt.anomaly.detector.kafka.topic=security.logs
vdt.anomaly.detector.kafka.group-id=security-anomaly-detector
vdt.anomaly.detector.key-prefix=vdt:anomaly
vdt.anomaly.detector.windows=60,300,900
vdt.anomaly.detector.success-windows=60,300
vdt.anomaly.detector.success-client-scope-enabled=true
vdt.anomaly.detector.success-ip-scope-enabled=false
vdt.anomaly.detector.violation-windows=60,300,900
vdt.anomaly.detector.counter-ttl-multiplier=2

# anomaly static rule engine
vdt.anomaly.static-rules.enabled=true
vdt.anomaly.static-rules.rule-cache-ttl-seconds=60
vdt.anomaly.static-rules.alert-open-statuses=OPEN,ACKED
vdt.anomaly.static-rules.anomaly-topic=security.anomalies
vdt.anomaly.static-rules.publish-enabled=true

# anomaly baseline job
vdt.anomaly.baseline-job.enabled=true
vdt.anomaly.baseline-job.cron=0 5 * * * *
vdt.anomaly.baseline-job.default-history-days=7
vdt.anomaly.baseline-job.cache-enabled=true
vdt.anomaly.baseline-job.cache-ttl-seconds=7200
vdt.anomaly.baseline-job.elasticsearch-url=http://localhost:9200
vdt.anomaly.baseline-job.index-pattern=security-logs-*
vdt.anomaly.baseline-job.timestamp-field=timestamp
vdt.anomaly.baseline-job.max-scopes=500

# anomaly baseline/hybrid realtime rules
vdt.anomaly.baseline-rules.enabled=true
vdt.anomaly.baseline-rules.rule-cache-ttl-seconds=60
vdt.anomaly.baseline-rules.baseline-cache-enabled=true
vdt.anomaly.baseline-rules.max-baseline-age-hours=2
vdt.anomaly.baseline-rules.default-time-bucket-type=SAME_HOUR
vdt.anomaly.baseline-rules.fallback-global-time-bucket=true
vdt.anomaly.hybrid-rules.enabled=true

# anomaly occurrence history
vdt.anomaly.occurrence.enabled=true
vdt.anomaly.occurrence.cooldown-enabled=true

# anomaly alert notification workflow
vdt.anomaly.notification.enabled=true
vdt.anomaly.notification.cooldown-default-minutes=15
vdt.anomaly.notification.email.enabled=false
vdt.anomaly.notification.webhook.enabled=false
vdt.anomaly.notification.sms.enabled=false
vdt.anomaly.notification.dashboard-url=http://localhost:3000/security-alerts
vdt.anomaly.elasticsearch.anomaly-index-pattern=security-anomalies-*
vdt.anomaly.elasticsearch.anomaly-index-prefix=security-anomalies

# exposed_api default settings
app.security.exposed.default.max-requests=100
app.security.exposed.default.throttle-window-sec=60
app.security.exposed.default.max-request-kb=1024
app.security.exposed.default.max-response-kb=2048
app.security.exposed.default.latency-threshold-ms=1000
app.security.exposed.default.timeout-ms=30000
app.security.exposed.default.log-retention-days=30
app.security.exposed.default.enabled=true

# client credential secrets
app.client-credential.encryption-key=${APP_CLIENT_CREDENTIAL_ENCRYPTION_KEY}
