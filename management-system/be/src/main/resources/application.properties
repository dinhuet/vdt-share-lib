spring.application.name=be
server.port=8081

# postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/shared-lib
spring.datasource.username=admin
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.timezone=Asia/Ho_Chi_Minh
spring.jpa.hibernate.ddl-auto=update
# keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/vdt-shared-lib
#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=true

spring.kafka.consumer.group-id=management-system
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false