spring.application.name=be
server.port=8081

# postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/shared-lib
spring.datasource.username=admin
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.timezone=+07:00

# keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/vdt-shared-lib
spring.security.oauth2.client.registration.keycloak.client-id=be-app
spring.security.oauth2.client.registration.keycloak.client-secret=d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f90
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/vdt-shared-lib
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
