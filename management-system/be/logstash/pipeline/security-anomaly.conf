input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["security.anomalies"]
    group_id => "security-anomaly-logstash"
    codec => json
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"]
      target => "@timestamp"
      tag_on_failure => ["_security_anomaly_date_parse_failure"]
    }
  }
  if [windowStart] {
    date {
      match => ["windowStart", "ISO8601", "UNIX", "UNIX_MS"]
      target => "windowStart"
      tag_on_failure => ["_security_anomaly_window_start_parse_failure"]
    }
  }
  if [windowEnd] {
    date {
      match => ["windowEnd", "ISO8601", "UNIX", "UNIX_MS"]
      target => "windowEnd"
      tag_on_failure => ["_security_anomaly_window_end_parse_failure"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-anomalies-%{+YYYY.MM.dd}"
  }
}
