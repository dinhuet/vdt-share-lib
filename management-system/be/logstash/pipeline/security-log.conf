input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["security.logs"]
    group_id => "security-log-logstash"
    codec => json
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"]
      target => "@timestamp"
      tag_on_failure => ["_security_log_date_parse_failure"]
    }
  }

  if ![retentionBucket] or [retentionBucket] !~ /^(r14|r30|r90)$/ {
    mutate { replace => { "retentionBucket" => "r30" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs-%{[retentionBucket]}-%{+YYYY.MM.dd}"
  }
}
