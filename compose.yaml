services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shared-lib}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak-demo
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./management-system/be/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: vdt-shared-lib-demo-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    depends_on:
      - kafka
      - elasticsearch
    volumes:
      - ./management-system/be/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./management-system/be/logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  management-be:
    build:
      context: .
      dockerfile: management-system/be/Dockerfile
    depends_on:
      - postgres
      - redis
      - keycloak
      - kafka
      - elasticsearch
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shared-lib}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/vdt-shared-lib
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/vdt-shared-lib/protocol/openid-connect/certs
      VDT_ANOMALY_BASELINE_JOB_ELASTICSEARCH_URL: http://elasticsearch:9200
      VDT_ANOMALY_NOTIFICATION_DASHBOARD_URL: http://localhost:3000/security-alerts
      APP_CLIENT_CREDENTIAL_ENCRYPTION_KEY: ${APP_CLIENT_CREDENTIAL_ENCRYPTION_KEY:-vdt-local-container-secret}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8081"

  management-fe:
    build:
      context: .
      dockerfile: management-system/fe/Dockerfile
    depends_on:
      - management-be
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-vdt-shared-lib}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-fe-app}
      KIBANA_DASHBOARD_URL: ${KIBANA_DASHBOARD_URL:-http://localhost:5601}
    ports:
      - "3000:80"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
